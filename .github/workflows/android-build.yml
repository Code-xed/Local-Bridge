name: LoBBY Android CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pull-request:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK for validation
        run: gradle --no-daemon clean :app:assembleDebug

  publish-release:
    name: Build and publish signed release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          VERSION_PATCH=$((GITHUB_RUN_NUMBER + 1))
          VERSION_NAME="0.5.${VERSION_PATCH}-alpha"
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          echo "Building LoBBY ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Restore release signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$SIGNING_KEY" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "One or more signing secrets are missing. Check SIGNING_KEY, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/lobby-release.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "LOBBY_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle --no-daemon clean :app:assembleRelease
          -PversionCode=${{ steps.version.outputs.version_code }}
          -PversionName=${{ steps.version.outputs.version_name }}

      - name: Prepare release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/app-release.apk "release-files/LoBBY-${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: LoBBY v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-files/*.apk
          fail_on_unmatched_files: true
